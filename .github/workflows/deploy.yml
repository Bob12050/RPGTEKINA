name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dq-style-rpg-game-bxrgsx, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存関係をインストール
        run: npm ci
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      - name: gh-pages ブランチへ公開
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
