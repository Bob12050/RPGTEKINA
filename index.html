      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a14;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game-root {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      /* 縦持ちのスマホでは画面上部に寄せて、下半分をタッチ操作用に空ける */

        #game-root {
          align-items: flex-start;
          padding-top: env(safe-area-inset-top, 0);
        }
      }
      canvas {
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 100vh;
        /* aspect-ratio は画面の向きに応じて main.ts が設定する */
        outline: none;
        touch-action: none;
      }
